# Gate G-SDK: set these to the licensed Niagara 4 installation you build against.
# CI never reads this file; it compiles the sources against niagara-module/stubs.

#gradlePluginHome=
niagara_home=/opt/Niagara-4.15
niagara_user_home=/home/<you>/Niagara4.15/tridium

# Code-signing (see build.gradle.kts). Keep the profile outside version control.
#bactalkSigningAlias=bactalk-code-cert
#bactalkSigningProfile=local/signing_profile.xml

# Niagara builds require a full JDK matching the Workbench release.
#org.gradle.java.installations.paths=
